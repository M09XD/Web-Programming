<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile Card</title>
<link rel="stylesheet" href="profile-card.css">
</head>
<body>
  <div class="card">
    <h1 class="name">Mahmudul Hasan</h1>
    <p class="role">Lecturer, CSE, UIU</p>

    <div class="stats">
      <div class="stat">
        <span class="stat-number">227</span>
        <span class="stat-label">Posts</span>
      </div>
      <div class="stat">
        <span class="stat-number">459</span>
        <span class="stat-label">Followers</span>
      </div>
      <div class="stat">
        <span class="stat-number">312</span>
        <span class="stat-label">Following</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn follow" type="button">Follow</button>
      <button class="btn message" type="button">Message</button>
    </div>
  </div>
</body>
</html>
