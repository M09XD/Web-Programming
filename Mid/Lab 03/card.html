<!DOCTYPE html>
<html>
    <head>
        <title>Photo Card</title>
        <link rel="stylesheet" href="main.css">

    </head>
    <body>
        <div class="card">
            
            <div class="name">Mahmudul Hasan</div>
            <div class="role">Lecturer, CSE, UIU</div>

            <div class="status">
                <div class="stat">
                    <div class="number">227</div>
                    <div class="label">Posts</div>

                </div>

                <div class="stat">
                    <div class="number">459</div>
                    <div class="label">Followers</div>
                    
                </div>

                <div class="stat">
                    <div class="number">312</div>
                    <div class="label">Following</div>
                    
                </div>
            </div>
            <div class="buttons">
                <button class="btn follow">Follow</button>
                <button class="btn message">Message</button>
            </div>
        </div>
    </body>
</html>
